# Full local stack: PostgreSQL + migrations + realtime/exec backend + Next.js app.
#
#   docker compose up --build
#
# Then open http://localhost:3000. Optional settings (OAuth, OpenAI, ...) are
# read from .env if it exists.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arcadeide
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arcadeide"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/arcadeide
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./server
    restart: unless-stopped
    environment:
      ROOM_TOKEN_SECRET: ${ROOM_TOKEN_SECRET:-arcadeide-dev-secret-change-me}
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/arcadeide
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-nextauth-secret-change-me}
      ROOM_TOKEN_SECRET: ${ROOM_TOKEN_SECRET:-arcadeide-dev-secret-change-me}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started

volumes:
  postgres_data:
